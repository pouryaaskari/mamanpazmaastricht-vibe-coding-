<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Menu - Mamanpaz Maastricht</title>
  </head>
  <body>
    <!-- Header (copied from index.html) -->
    <div class="header">
      <img class="logo" src="icons/logomamanpaz.PNG" alt="logo">
      <div class="site-title">
        <p class="site-name">Mamanpaz Maastricht</p>
        <p class="site-sub">Authentic Persian Restaurant</p>
      </div>
      <img class="logo" src="icons/logomamanpaz.PNG" alt="logo">
    </div>

    <!-- Left navigation (copied from index.html) -->
    <div class="left-div">
      <a href="menu.html" aria-current="page"><button class="menu"><img class="button-icon" src="icons/menu.png" alt="Menu icon"><span>Menu</span></button></a>
      <button class="events"><img class="button-icon" src="icons/events.png" alt="Events icon"><span>Events & Arrangements</span></button>
      <button class="contactus"><img class="button-icon" src="icons/contactus.png" alt="Contact icon"><span>Contact us</span></button>
      <button class="aboutus"><img class="button-icon" src="icons/aboutus.png" alt="About icon"><span>About us</span></button>
    </div>

    <!-- Menu content (simple themed layout) -->
    <div class="menu-page">
      <h2 class="menu-title">Our Menu</h2>
      <div class="menu-list">
        <div class="menu-item"><div class="item-name">Chelo Kabab (Chicken)</div><div class="item-price">€16</div></div>
        <div class="menu-item"><div class="item-name">Ghorme Sabzi (Stew)</div><div class="item-price">€14</div></div>
        <div class="menu-item"><div class="item-name">Fesenjan (Walnut & Pomegranate)</div><div class="item-price">€17</div></div>
        <div class="menu-item"><div class="item-name">Khoresht-e Bademjan (Eggplant Stew)</div><div class="item-price">€15</div></div>
        <div class="menu-item"><div class="item-name">Vegetarian Rice Plate</div><div class="item-price">€12</div></div>
        <div class="menu-item"><div class="item-name">Dessert: Persian Saffron Ice Cream</div><div class="item-price">€6</div></div>
      </div>
      <div style="text-align:center; margin-top:18px;">
        <a href="index.html"><button class="hero-button2">Back to Home</button></a>
      </div>
    </div>
  </body>
</html>
