<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="MamanPaz Maastricht — authentic Iranian food, takeaway, delivery and reservations.">
      <link rel="stylesheet" href="style.css">
      <title>Mamanpaz Iraans Restaurant</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>

    <body class="menu-page">

      <div class="header">
        <img class="logo" src="icons/logomamanpaz.PNG" alt="MamanPaz Maastricht">
        <div class="site-title">
          <p class="site-name">Mamanpaz Maastricht</p>
          <p class="site-sub">Authentic Iranian Restaurant</p>
        </div>
        <img class="logo" src="icons/logomamanpaz.PNG" alt="MamanPaz Maastricht">
      </div>

      <div class="left-div">
        <a href="index.html" aria-label="Home"><button class="home"><img class="button-icon" src="icons/home.png" alt="Home icon"><span>Home</span></button></a>
        <a href="menu.html" aria-label="Menu"><button class="menu"><img class="button-icon" src="icons/menu.png" alt="Menu icon"><span>Menu</span></button></a>
        <a href="event.html" aria-label="Events and arrangements"><button class="events" type="button"><img class="button-icon" src="icons/events.png" alt="Events icon"><span>Events & Arrangements</span></button></a>
        <a href="contactus.html" aria-label="Contact us"><button class="contactus" type="button"><img class="button-icon" src="icons/contactus.png" alt="Contact icon"><span>Contact us</span></button></a>
        <a href="aboutus.html" aria-label="About us"><button class="aboutus" type="button"><img class="button-icon" src="icons/aboutus.png" alt="About icon"><span>About us</span></button></a>
      </div>

      <div class="main-page">
        <p class="hero-p">Discover our family recipes, fresh ingredients and the warmth of home❤️</p>
        <div class="hero-actions">
          <a href="menu.html"><button class="hero-button"><img class="hero-icon" src="icons/delivery.svg" alt=""><span>Delivery/Takeaway</span></button></a>
          <a href="reservation.html"><button class="hero-button2"><img class="hero-icon" src="icons/reservation.svg" alt=""><span>Reservation</span></button></a>
        </div>
      </div>

      <section class="google-reviews home-reviews" aria-labelledby="home-reviews-title">
        <div class="reviews-heading">
          <div>
            <p class="events-kicker">From our guests</p>
            <h2 id="home-reviews-title">Google Reviews</h2>
          </div>
          <span class="google-mark" aria-hidden="true">G</span>
        </div>
        <p class="reviews-intro">Real reviews from our Google Business Profile will appear here.</p>
        <div class="reviews-widget-slot" aria-label="Google customer reviews">
          <!-- Paste the review widget embed code from your provider here. -->
        </div>
        <a class="reviews-link" href="https://www.google.com/search?q=Mamanpaz+Maastricht+reviews" target="_blank" rel="noopener">Read all reviews on Google <span aria-hidden="true">↗</span></a>
      </section>

      <a class="staff-login-link" href="/admin/login">Staff Login</a>


      <script src="site.js"></script>
    </body>


</html>
